name: Bot de trading (simulado)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      reset_capital:
        description: "Reiniciar la simulación con este capital (vacío = no reiniciar)"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ejecutar bot
        env:
          RESET_CAPITAL: ${{ github.event.inputs.reset_capital }}
        run: python bot.py
      - name: Guardar estado
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add data/state.json config.json
          git commit -m "Actualización del bot $(date -u +%Y-%m-%dT%H:%MZ)" || echo "sin cambios"
          git pull --rebase || true
          git push
      - name: Preparar web
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/state.json _site/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
