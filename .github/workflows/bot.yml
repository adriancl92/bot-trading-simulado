name: Bot de trading (simulado)

# El bot corre en un bucle de ~5 h 40 min que se ejecuta cada 15 minutos y, al terminar,
# se relanza a sí mismo. El cron solo sirve de respaldo por si la cadena se corta.
on:
  schedule:
    - cron: "7 */2 * * *"
  workflow_dispatch:
    inputs:
      reset_capital:
        description: "Reiniciar la simulación con este capital (vacío = no reiniciar)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bucle del bot (cada 15 min)
        env:
          RESET_CAPITAL_INPUT: ${{ github.event.inputs.reset_capital }}
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          end=$(( $(date +%s) + 340*60 ))
          first=1
          while [ "$(date +%s)" -lt "$end" ]; do
            git pull -q --rebase || true
            if [ "$first" = "1" ]; then export RESET_CAPITAL="$RESET_CAPITAL_INPUT"; else export RESET_CAPITAL=""; fi
            first=0
            python bot.py || echo "fallo en esta ejecución, se reintenta en la siguiente"
            git add data/state.json config.json
            if git commit -qm "Actualización del bot $(date -u +%Y-%m-%dT%H:%MZ)"; then
              for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
            fi
            now=$(date +%s); next=$(( (now/900 + 1)*900 + 30 ))
            [ "$next" -ge "$end" ] && break
            sleep $(( next - now ))
          done
      - name: Relanzar el bot
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot.yml --ref main -R ${{ github.repository }}
